<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BuyFlow Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <div class="login-card">

            <h1>BuyFlow</h1>
            <p>Faça login para continuar</p>

            <input
                type="text"
                id="username"
                placeholder="Usuário">

            <input
                type="password"
                id="password"
                placeholder="Senha">

            <button id="loginBtn">
                Entrar
            </button>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
